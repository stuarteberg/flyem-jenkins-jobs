logfile: logs/fish2-derived-updates.log

dvid:
    server: http://emdata7.int.janelia.org:8400
    ignore-mutations-before-uuid: 7ac4872ed9fe434abe832a952bd44c0d
    uuid: ':master'
    segmentation-name: segmentation
    timeout: 600.0

update-derived-types: [meshes, sv-meshes, skeletons, annotations]
#update-derived-types: [skeletons, annotations]

# These settings were copied from the original mesh run:
# /groups/flyem/data/scratchspace/flyemflows/fishemf/ingestion-jobs/prod-chunk-meshes-20250322.220631/workflow.yaml
body-meshes:
    # Notes:
    #  - chunk config must match the chunk-meshes.config-name
    #  - method must match a chunk-meshes.quality-configs[i].name, below.
    source-method: concatenated-chunks-512_ddeda-sc1_halo2_cl8_filled_sm3_dec005

    smoothing: 0
    small-body-overall-decimation-s0: 0.01
    large-body-overall-decimation-s0: 0.001
    small-body-cutoff-vertices-s0: 10e6
    large-body-cutoff-vertices-s0: 100e6

chunk-meshes:
    base-uuid: ddeda82d31c94dfca506db671b03a4bf
    # This is roughly the same as the 1k config we used on yakuba and MaleCNS,
    # since our version of the fish uses 16nm voxels.
    chunk-shape-s0: [512, 512, 512]
    config-name: 512_ddeda
    chunk-halo: 2
    quality-configs:
        # Note: name must match suffix in 'source-method', above.
        - name: sc1_halo2_cl8_filled_sm3_dec005
          source-scale: 1
          morphological-closing-s0: 8
          fill-holes: True
          smoothing: 3
          decimation-s0: 0.005

skeletons:
    neutu-executable: .pixi/envs/neutu/bin/neutu
    scale: coarse

force-update: false
